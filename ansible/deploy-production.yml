---
- name: Deploy Microservices using GitHub Container Registry
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    app_name: microservice-admin-app
    app_dir: "/opt/{{ app_name }}"
    docker_compose_file: docker-compose.production.yml
    ghcr_registry: "{{ ghcr_registry | default('ghcr.io') }}"
    image_version: "{{ image_version | default('latest') }}"
    ghcr_owner: "{{ ghcr_owner | default('shivamsingh163248') }}"

  pre_tasks:
  - name: Display deployment information
    debug:
      msg:
      - "🚀 Starting deployment of {{ app_name }}"
      - "📦 Version: {{ image_version }}"
      - "🏗️  Registry: {{ ghcr_registry }}"
      - "👤 Owner: {{ ghcr_owner }}"
      - "📂 Target Directory: {{ app_dir }}"

  tasks:
  - name: Update system packages
    apt:
      update_cache: yes
      cache_valid_time: 3600
    when: ansible_os_family == "Debian"

  - name: Remove conflicting packages first
    apt:
      name:
      - containerd
      - docker
      - docker-engine
      - docker.io
      - docker-ce
      - docker-ce-cli
      state: absent
    when: ansible_os_family == "Debian"
    ignore_errors: yes

  - name: Remove existing Docker repository files
    file:
      path: "{{ item }}"
      state: absent
    loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.gpg
    - /usr/share/keyrings/docker-archive-keyring.gpg
    ignore_errors: yes

  - name: Install Docker dependencies
    apt:
      name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      state: present
    when: ansible_os_family == "Debian"

  - name: Create keyrings directory
    file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Add Docker GPG key
    shell: |
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
    when: ansible_os_family == "Debian"

  - name: Add Docker repository
    apt_repository:
      repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
      state: present
      filename: docker
    when: ansible_os_family == "Debian"

  - name: Update package cache after adding Docker repo
    apt:
      update_cache: yes
    when: ansible_os_family == "Debian"

  - name: Install Docker and required packages
    apt:
      name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - git
      - curl
      - unzip
      - python3-pip
      state: present
    when: ansible_os_family == "Debian"

  - name: Download Docker Compose binary
    get_url:
      url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
      dest: /usr/local/bin/docker-compose
      mode: '0755'
    become: yes

  - name: Create docker-compose symlink for compatibility
    file:
      src: /usr/local/bin/docker-compose
      dest: /usr/bin/docker-compose
      state: link
    become: yes

  - name: Verify Docker Compose installation
    command: docker-compose --version
    register: docker_compose_check

  - name: Display Docker Compose version
    debug:
      msg: "Docker Compose installed: {{ docker_compose_check.stdout }}"

  - name: Start and enable Docker service
    systemd:
      name: docker
      state: started
      enabled: yes

  - name: Add user to docker group
    user:
      name: "{{ ansible_user }}"
      groups: docker
      append: yes

  - name: Reset SSH connection to activate docker group membership
    meta: reset_connection

  - name: Verify docker group membership
    command: groups {{ ansible_user }}
    register: user_groups

  - name: Display user groups
    debug:
      msg: "User groups: {{ user_groups.stdout }}"

  - name: Test Docker access
    command: docker info
    become_user: "{{ ansible_user }}"
    register: docker_test
    ignore_errors: yes

  - name: Display Docker test result
    debug:
      msg: "Docker access: {{ 'SUCCESS' if docker_test.rc == 0 else 'FAILED - ' + docker_test.stderr }}"

  - name: Create application directory
    file:
      path: "{{ app_dir }}"
      state: directory
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0755'

  - name: Clone or update application repository
    git:
      repo: "https://github.com/{{ ghcr_owner }}/Microservice-admin-apps.git"
      dest: "{{ app_dir }}"
      version: main
      force: yes
    become_user: "{{ ansible_user }}"

  - name: Create production docker-compose file
    template:
      src: docker-compose.production.yml.j2
      dest: "{{ app_dir }}/{{ docker_compose_file }}"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0644'

  - name: Stop existing containers
    command: docker-compose -f {{ docker_compose_file }} down
    args:
      chdir: "{{ app_dir }}"
    become_user: "{{ ansible_user }}"
    ignore_errors: yes

  - name: Login to GitHub Container Registry
    command: >
      docker login {{ ghcr_registry }}  -u {{ ghcr_owner }}  -p {{ ansible_env.GITHUB_TOKEN | default('') }}
    become_user: "{{ ansible_user }}"
    when: ansible_env.GITHUB_TOKEN is defined
    no_log: true

  - name: Pull latest Docker images
    command: docker-compose -f {{ docker_compose_file }} pull
    args:
      chdir: "{{ app_dir }}"
    become_user: "{{ ansible_user }}"

  - name: Start services with docker-compose
    command: docker-compose -f {{ docker_compose_file }} up -d
    args:
      chdir: "{{ app_dir }}"
    become_user: "{{ ansible_user }}"

  - name: Wait for database to be ready
    wait_for:
      port: 3306
      host: localhost
      delay: 10
      timeout: 300
      msg: "Database service did not start within 5 minutes"

  - name: Wait for backend to be ready
    wait_for:
      port: 5001
      host: localhost
      delay: 5
      timeout: 300
      msg: "Backend service did not start within 5 minutes"

  - name: Wait for frontend to be ready
    wait_for:
      port: 8081
      host: localhost
      delay: 5
      timeout: 300
      msg: "Frontend service did not start within 5 minutes"

  - name: Verify deployment - Backend health check
    uri:
      url: "http://localhost:5001/health"
      method: GET
      status_code: 200
    retries: 5
    delay: 10
    register: backend_health

  - name: Verify deployment - Frontend accessibility
    uri:
      url: "http://localhost:8081"
      method: GET
      status_code: 200
    retries: 5
    delay: 10
    register: frontend_health

  - name: Clean up old Docker images
    command: docker image prune -f
    become_user: "{{ ansible_user }}"

  - name: Clean up old Docker containers
    command: docker container prune -f
    become_user: "{{ ansible_user }}"

  - name: Display service status
    command: docker-compose -f {{ docker_compose_file }} ps
    args:
      chdir: "{{ app_dir }}"
    become_user: "{{ ansible_user }}"
    register: service_status

  - name: Show deployment results
    debug:
      msg:
      - "✅ Deployment completed successfully!"
      - "🔗 Frontend URL: http://{{ ansible_default_ipv4.address }}:8081"
      - "🔗 Backend API: http://{{ ansible_default_ipv4.address }}:5001"
      - "🔗 Backend Health: http://{{ ansible_default_ipv4.address }}:5001/health"
      - "📂 Application Directory: {{ app_dir }}"
      - "🏷️  Deployed Version: {{ image_version }}"
      - "📊 Service Status:"
      - "{{ service_status.stdout_lines }}"

  post_tasks:
  - name: Send deployment notification
    debug:
      msg:
      - "🎉 Deployment Summary:"
      - "Application: {{ app_name }}"
      - "Version: {{ image_version }}"
      - "Server: {{ ansible_hostname }} ({{ ansible_default_ipv4.address }})"
      - "Status: SUCCESS ✅"
